      - bearerAuth: []
      description: Write super admin only. Grants write platform admin access to a
        confirmed Meedan email user who currently has read-only access.
      parameters:
      - name: id
        in: path
        required: true
        description: User ID of the platform admin to upgrade
        schema:
          type: integer
      responses:
        '200':
