  "/api/sources/ownership_code":
    post:
      summary: Get the code that proves ownership of a WordPress site
      tags:
      - Source
      security:
      - bearerAuth: []
      description: Returns the code an admin adds to their WordPress site's tagline
        before calling `verify_ownership`, and the settings page where the tagline
        is changed. When the site supports Application Passwords, also returns the
        page where its admin can approve Suwali instead; WordPress then sends them
        to the frontend's `/wordpress/authorized` page with a `state`, `user_login`
        and `password`. Admins only.
      parameters: []
      responses:
        '200':
          description: Ownership code returned
        '422':
          description: Invalid site URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    hub_id:
                      type: integer
                      example: 1
                    source_type:
                      type: string
                      example: wordpress_api
                      enum:
                      - wordpress_api
                    config:
                      type: object
                      properties:
                        site_url:
                          type: string
                          example: https://blog.example.com
                  required:
                  - hub_id
                  - config
              required:
              - source
  "/api/sources/verify_ownership":
    post:
      summary: Verify ownership of a WordPress site through its tagline or an Application
        Password
      tags:
      - Source
      security:
      - bearerAuth: []
      description: Checks the site's tagline for the code from `ownership_code` or,
        when `authorization` is sent, signs in with the Application Password the site's
        admin approved, checks that it belongs to an administrator, and revokes it.
        When either proves ownership, returns a receipt, valid for one hour, to send
        as `source.ownership_receipt` when creating the source or changing its site.
        Admins only.
      parameters: []
      responses:
        '200':
          description: Verification result
        '422':
          description: Tagline could not be read
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    hub_id:
                      type: integer
                      example: 1
                    source_type:
                      type: string
                      example: wordpress_api
                      enum:
                      - wordpress_api
                    config:
                      type: object
                      properties:
                        site_url:
                          type: string
                          example: https://blog.example.com
                  required:
                  - hub_id
                  - source_type
                  - config
                authorization:
                  type: object
                  description: What WordPress sent back after its admin approved Suwali.
                    Omit to check the tagline instead.
                  properties:
                    state:
                      type: string
                      description: From the `success_url` in `authorize_url`
                    user_login:
                      type: string
                      example: admin
                    password:
                      type: string
                      example: abcd EFGH 1234 ijkl MNOP 6789
                  required:
                  - state
                  - user_login
                  - password
              required:
              - source
