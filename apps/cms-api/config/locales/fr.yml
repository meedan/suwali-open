  mailer_hub_welcome_new_member_subject: "Bienvenue à %{hub_name} sur Suwali!"
  mailer_hub_welcome_new_member_greeting: "Succès!"
  mailer_hub_welcome_new_member_body: "Votre demande d'adhésion à %{hub_name} sur Suwali a été approuvée."
  mailer_hub_welcome_new_member_action: "Accéder à Suwali"
  mailer_hub_trial_greeting: "Bonjour %{name},"
  mailer_hub_trial_welcome_subject: "Bienvenue sur Suwali! Programmons votre appel de bienvenue"
  mailer_hub_trial_welcome_body: "Bienvenue sur Suwali! Votre essai gratuit a commencé.\n\nPréparez-vous à répondre aux questions de votre communauté avec le contenu en lequel vous avez confiance. Ensuite, faites quelque chose qu'aucun autre chatbot ne fait - écoutez ce qu'ils répondent.\n\nAjoutez les premiers documents, articles ou contenus que votre chatbot utilisera pour répondre aux questions, puis essayez de poser une question sur votre contenu.\n\nSi vous avez besoin d'aide pour configurer le tout, veuillez nous contacter à %{support_email}, ou réservez une démonstration avec nous :\n%{demo_link}\n\nMerci !"
  mailer_hub_trial_halfway_subject: "Comment se passe votre essai de Suwali ?"
  mailer_hub_trial_halfway_body: "Nous espérons que vous avez ajouté du contenu à Suwali et essayé de discuter avec votre chatbot. Nous serions ravis de savoir comment ça se passe.\n\nSaviez-vous que Suwali peut répondre à votre audience en anglais, espagnol, français, hindi, arabe et portugais ?\n\n%{personalization_link}\n\nSi vous avez besoin d'aide pour configurer le tout, veuillez nous contacter à %{support_email}, ou réservez une démonstration avec nous :\n%{demo_link}\n\nMerci !"
  mailer_hub_trial_one_week_left_subject: "Prêt à passer à la prochaine phase de Suwali ?"
  mailer_hub_trial_one_week_left_body: "Nous vous contactons pour savoir comment se passe votre essai de Suwali. Prêt à vous connecter à une plateforme de messagerie et à présenter votre chatbot à votre audience ?\n\n%{whatsapp_link}\n\nLa plupart des chatbots se contentent de répondre aux questions. Suwali est conçu pour aller plus loin — en invitant les gens à partager des conseils, des idées et des expériences de leur vie quotidienne pour que votre équipe les révise, les vérifie et les intègre dans les réponses futures.\n\nSi vous avez besoin d'aide pour configurer le tout, ou si vous êtes prêt à débloquer l'expérience complète de Suwali, veuillez nous contacter à %{support_email}, ou réservez une démonstration avec nous :\n%{demo_link}\n\nMerci !"
  mailer_hub_trial_three_days_left_subject: "Votre essai de Suwali se termine bientôt !"
  mailer_hub_trial_three_days_left_body: "Nous espérons que vous avez eu la chance de voir comment Suwali peut faire émerger des questions sans réponse, des lacunes en informations et des sujets émergents de votre audience.\n\nVotre essai gratuit se termine bientôt. Quand cela arrivera, vous aurez toujours accès à Suwali, mais ce sera une expérience en lecture seule.\n\nSuwali a été conçu pour les organisations où la confiance n'est pas facultative. Si vous souhaitez discuter de la manière dont cela peut renforcer votre organisation, ou si vous êtes prêt à débloquer l'expérience complète de Suwali, veuillez nous contacter à %{support_email}, ou réservez une démonstration avec nous :\n%{demo_link}\n\nMerci !"
  mailer_hub_trial_ends_tomorrow_subject: "Demain est le dernier jour de votre essai Suwali"
  mailer_hub_trial_ends_tomorrow_body: "Votre essai gratuit de Suwali se termine demain ! Merci de nous avoir testé.\n\nSi vous êtes prêt à débloquer l'expérience complète de Suwali, veuillez nous contacter à %{support_email}, ou réservez une démonstration avec nous :\n%{demo_link}\n\nMerci !"
  mailer_hub_trial_hub_deleted_subject: "Votre compte Suwali a été supprimé"
  mailer_hub_trial_hub_deleted_body: "Votre compte Suwali a été supprimé.\n\nNous sommes désolés de vous voir partir, mais nous vous remercions de nous avoir essayés.\n\nSi jamais vous souhaitez réessayer, vous pouvez créer un compte sur %{suwali_link} ou nous contacter pour planifier une démonstration et voir ce qui est nouveau depuis votre dernière tentative :\n%{demo_link}\n\nMerci !"
  message_registration_check_email: "Veuillez vérifier votre e-mail pour les prochaines étapes."
  mailer_user_account_exists_subject: "Tentative d'inscription sur Suwali"
  mailer_user_account_exists_greeting: "Bonjour %{email},"
  mailer_user_account_exists_body: "Quelqu'un (espérons que c'était vous) a essayé de créer un compte sur Suwali en utilisant cette adresse e-mail, mais un compte existe déjà. Si c'était vous, vous pouvez vous connecter ou réinitialiser votre mot de passe en utilisant le lien ci-dessous. Si ce n'était pas vous, vous pouvez ignorer cet e-mail en toute sécurité."
