  mailer_hub_trial_greeting: "Olá %{name},"
  mailer_hub_trial_welcome_subject: "Bem-vindo ao Suwali! Vamos agendar sua chamada de integração"
  mailer_hub_trial_welcome_body: "Bem-vindo ao Suwali! Seu período de teste gratuito começou.\n\nPrepare-se para responder às perguntas da sua comunidade com o conteúdo que você confia. Então, faça algo que nenhum outro chatbot faz — ouça o que eles dizem de volta.\n\nAdicione os primeiros documentos, artigos ou conteúdos que seu chatbot utilizará para responder às perguntas, depois tente fazer uma pergunta sobre seu conteúdo.\n\nSe precisar de ajuda com a configuração, entre em contato com %{support_email}, ou marque uma demonstração conosco:\n%{demo_link}\n\nObrigado!"
  mailer_hub_trial_halfway_subject: "Como está indo seu teste do Suwali?"
  mailer_hub_trial_halfway_body: "Esperamos que você tenha adicionado algum conteúdo ao Suwali e experimentado conversar com seu chatbot. Adoraríamos saber como estão indo as coisas.\n\nVocê sabia que o Suwali pode responder ao seu público em inglês, espanhol, francês, hindi, árabe e português?\n\n%{personalization_link}\n\nSe precisar de ajuda com a configuração, entre em contato com %{support_email}, ou marque uma demonstração conosco:\n%{demo_link}\n\nObrigado!"
  mailer_hub_trial_one_week_left_subject: "Pronto para passar para a próxima fase do Suwali?"
  mailer_hub_trial_one_week_left_body: "Estamos entrando em contato para ver como estão indo as coisas com seu teste do Suwali. Pronto para se conectar a uma plataforma de mensagens e colocar seu chatbot na frente de seu público?\n\n%{whatsapp_link}\n\nA maioria dos chatbots só responde a perguntas. O Suwali foi criado para continuar — convidando pessoas a compartilhar dicas, insights e experiências de suas vidas diárias para que sua equipe revise, verifique e incorpore em respostas futuras.\n\nSe precisar de ajuda com a configuração, ou estiver pronto para desbloquear a experiência completa do Suwali, entre em contato com %{support_email}, ou marque uma demonstração conosco:\n%{demo_link}\n\nObrigado!"
  mailer_hub_trial_three_days_left_subject: "Seu teste do Suwali termina em breve!"
  mailer_hub_trial_three_days_left_body: "Esperamos que você tenha tido a chance de ver como o Suwali pode trazer à tona perguntas não respondidas, lacunas de informação e tópicos emergentes do seu público.\n\nSeu teste gratuito termina em breve. Quando isso acontecer, você ainda terá acesso ao Suwali, mas ele se tornará uma experiência apenas de leitura.\n\nO Suwali foi criado para organizações onde a confiança não é opcional. Se quiser conversar sobre como ele pode potencializar sua organização ou estiver pronto para desbloquear a experiência completa do Suwali, entre em contato com %{support_email}, ou marque uma demonstração conosco:\n%{demo_link}\n\nObrigado!"
  mailer_hub_trial_ends_tomorrow_subject: "Amanhã é o último dia do seu teste do Suwali"
  mailer_hub_trial_ends_tomorrow_body: "Seu teste gratuito do Suwali termina amanhã! Obrigado por nos dar uma chance.\n\nSe estiver pronto para desbloquear a experiência completa do Suwali, entre em contato com %{support_email}, ou marque uma demonstração conosco:\n%{demo_link}\n\nObrigado!"
  mailer_hub_trial_hub_deleted_subject: "Sua conta do Suwali foi removida"
  mailer_hub_trial_hub_deleted_body: "Sua conta do Suwali foi removida.\n\nLamentamos ver você partir, mas agradecemos por nos dar uma chance.\n\nSe quiser tentar novamente, você pode criar uma conta em %{suwali_link} ou entrar em contato conosco para agendar uma demonstração e ver o que há de novo desde a última vez que você tentou:\n%{demo_link}\n\nObrigado!"
  message_registration_check_email: "Por favor, verifique seu email para os próximos passos."
  mailer_user_account_exists_subject: "Tentativa de cadastro no Suwali"
  mailer_user_account_exists_greeting: "Oi %{email},"
  mailer_user_account_exists_body: "Alguém (esperamos que tenha sido você) tentou criar uma conta no Suwali usando este endereço de email, mas uma conta já existe. Se foi você, pode acessar ou redefinir sua senha usando o link abaixo. Se não foi você, pode ignorar este email."
