  "/api/sources":
    post:
      summary: Creates a source
      tags:
      - Source
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Source created
        '401':
          description: Unauthorized
        '404':
          description: Not found - no permission to create source
        '422':
          description: Uploaded files source without files
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    hub_id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Meedan Blog
                    source_type:
                      type: string
                      example: website
                      enum:
                      - website
                      - google_drive_folder
                      - conversation
                      - rss_feed
                      - json_api
                      - uploaded_files
                      - wordpress_api
                    ownership_receipt:
                      type: string
                      description: 'Required for `wordpress_api`: the receipt from
                        `/api/sources/verify_ownership`'
                    config:
                      type: object
                      example: {}
                      description: |
                        For `website` source type, configuration must include:

                        • `base_url`: base URL with optional `{page}` placeholder.

                        • `post_link_selector`, `title_selector`, `body_selector`: CSS selectors.

                        For `google_drive_folder` source type, configuration must include:

                        • `folder_url`: URL of a shared Google Drive folder (the folder MUST be shared with the service account email ckh-local@ckh-local.iam.gserviceaccount.com).

                        For `wordpress_api` source type, configuration must include:

                        • `site_url`: home page URL of a WordPress site with its REST API enabled.

                          Also send `source.ownership_receipt` from `/api/sources/verify_ownership`.

                        For `uploaded_files` source type, no configuration is needed. Files are uploaded via multipart form data in the `source[files][]` parameter.
                  required:
                  - hub_id
                  - name
                  - source_type
              required:
              - source
