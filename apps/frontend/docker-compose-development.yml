networks:
  dev:

services:
  frontend:
    build:
      context: .
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - dev
