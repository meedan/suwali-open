test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

s3: &s3
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "eu-west-1") %>
  bucket: <%= ENV["S3_BUCKET"] %>
  endpoint: <%= ENV["S3_ENDPOINT"] %> # Leave empty in production
  force_path_style: <%= ENV["S3_FORCE_PATH_STYLE"] == "true" %>

# same bucket as s3, but signs URLs with the host browsers reach; "silo" only resolves inside Docker
s3_public:
  <<: *s3
  endpoint: <%= ENV["S3_PUBLIC_ENDPOINT"].presence || ENV["S3_ENDPOINT"] %>
