# Security headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com https://challenges.cloudflare.com https://scripts.simpleanalyticscdn.com https://*.facebook.com https://*.facebook.net https://accounts.google.com/gsi/client https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data: https:; connect-src 'self' https://*.suwali.io https://cloudflareinsights.com https://challenges.cloudflare.com https://o361350.ingest.us.sentry.io https://*.simpleanalyticscdn.com https://*.facebook.com https://*.facebook.net https://accounts.google.com/gsi/ https://www.googleapis.com; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.suwali.io https://drive.google.com https://docs.google.com https://accounts.google.com/gsi/ https://view.officeapps.live.com https://*.facebook.com https://*.facebook.net; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
