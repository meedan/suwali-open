networks:
  dev:

services:
  cms-api:
    build:
      context: .
    ports:
      - "${CMS_API_PORT}:${CMS_API_PORT}"
    env_file: .env
    environment:
      RAILS_ENV: development
    volumes:
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CMS_API_PORT}/health"]
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s
    depends_on:
      - postgres
      - redis
      - silo
    networks:
      - dev

  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - dev

  sidekiq:
    build:
      context: .
    command: ./bin/start-sidekiq.sh
    env_file: .env
    environment:
      RAILS_ENV: development
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9393/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - redis
    networks:
      - dev

  postgres:
    # If you change this version, please change the postgresql-client version in Dockerfile
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # expose Postgres on host for local tools like DBeaver
      # if you have another local PostgreSQL on 5432, change host port (e.g., "55432:5432")
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - dev

  redis:
    image: redis:7
    volumes:
      - redis:/data
    networks:
      - dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 60s
      retries: 15
      start_period: 60s

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    ports:
      - "9000:9000"
      - "9001:9001" # Console UI
    volumes:
      - silo-data:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dev

  signal-listener:
    build:
      context: .
    command: ./bin/start-signal-listener.sh
    env_file: .env
    environment:
      RAILS_ENV: development
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
      - signal-cli
    networks:
      - dev

  signal-cli:
    # libsignal only ships its Linux native library for amd64, so on Apple Silicon this runs under emulation
    platform: linux/amd64
    build:
      context: ../../services/signal-cli
    ports:
      # signal-cli has no authentication, so only this machine may reach it, not the local network
      - "127.0.0.1:8080:8080"
    volumes:
      - signal-data:/var/lib/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dev

volumes:
  pg_data:
  redis:
  silo-data:
  signal-data:
