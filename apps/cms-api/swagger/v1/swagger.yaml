      summary: Creates a messaging integration
      tags:
      - MessagingIntegration
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Messaging integration created
        '401':
          description: Unauthorized
        '404':
          description: Not found - no permission to create messaging integration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                messaging_integration:
                  type: object
                  properties:
                    hub_id:
                      type: integer
                      example: 1
                    platform:
                      type: string
                      example: telegram
                      enum:
                      - telegram
                      - whatsapp
                      - sms
                      - signal
                    telegram_bot_token:
                      type: string
                      example: 123456789:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
                      description: Required only for telegram platform
                    sms_country:
                      type: string
                      example: US
                      description: Required only for sms platform (ISO 3166-1 alpha-2
                        country code); a number is provisioned for it
                    sms_number_type:
                      type: string
                      example: tollfree
                      enum:
                      - tollfree
                      - local
                      description: Optional for sms platform; number type to provision
                        (defaults to tollfree). Available types per country come from
                        /api/about
                    sms_state:
                      type: string
                      example: CA
                      description: Optional for sms platform with local number type;
                        two-letter state code to provision the number in
                    sms_area_code:
                      type: string
                      example: '718'
                      description: Optional for sms platform with local number type;
                        three-digit area code to provision the number in
                  required:
                  - hub_id
                  - platform
              required:
              - messaging_integration
