---
openapi: 3.0.1
info:
  title: SUWALI CMS API
  version: v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
- bearerAuth: []
paths:
  "/api/about":
    get:
      summary: Gets information about the application
      tags:
      - About
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Information returned
        '401':
          description: Unauthorized
  "/api/admin/hubs":
    get:
      summary: List all hubs with plan and usage data
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only endpoint to retrieve all hubs with their plan
        limits and current usage counts.
      responses:
        '200':
          description: Hubs returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    organization_name:
                      type: string
                      nullable: true
                    plan:
                      type: string
                    trial_active:
                      type: boolean
                    trial_expired:
                      type: boolean
                    trial_ends_at:
                      type: string
                      nullable: true
                      format: date-time
                    invite_code:
                      type: string
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    users_count:
                      type: integer
                    active_external_users_count:
                      type: integer
                    max_messages:
                      type: integer
                      nullable: true
                    sources_count:
                      type: integer
                    max_sources:
                      type: integer
                      nullable: true
                    documents_count:
                      type: integer
                    max_documents:
                      type: integer
                      nullable: true
                  required:
                  - id
                  - name
                  - plan
                  - trial_active
                  - trial_expired
                  - created_at
                  - users_count
                  - active_external_users_count
                  - sources_count
                  - documents_count
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/hubs/{id}":
    get:
      summary: Get a single hub with full detail and conversation activity
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only endpoint to retrieve a single hub with all plan/usage
        data and conversation activity timestamps.
      parameters:
      - name: id
        in: path
        required: true
        description: Hub ID
        schema:
          type: integer
      responses:
        '200':
          description: Hub returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  organization_name:
                    type: string
                    nullable: true
                  plan:
                    type: string
                  trial_active:
                    type: boolean
                  trial_expired:
                    type: boolean
                  trial_ends_at:
                    type: string
                    nullable: true
                    format: date-time
                  invite_code:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  users_count:
                    type: integer
                  active_external_users_count:
                    type: integer
                  max_messages:
                    type: integer
                    nullable: true
                  sources_count:
                    type: integer
                  max_sources:
                    type: integer
                    nullable: true
                  documents_count:
                    type: integer
                  max_documents:
                    type: integer
                    nullable: true
                  last_internal_conversation_at:
                    type: string
                    nullable: true
                    format: date-time
                  last_external_conversation_at:
                    type: string
                    nullable: true
                    format: date-time
                required:
                - id
                - name
                - plan
                - trial_active
                - trial_expired
                - created_at
                - users_count
                - active_external_users_count
                - sources_count
                - documents_count
                - last_internal_conversation_at
                - last_external_conversation_at
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
    patch:
      summary: Update admin-only fields of a hub
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: 'Super admin only. Updates sensitive hub fields: plan, trial dates,
        and custom limits. Trial dates must be in YYYY-MM-DD format. Custom limit
        values must be non-negative integers.'
      parameters:
      - name: id
        in: path
        required: true
        description: Hub ID
        schema:
          type: integer
      responses:
        '200':
          description: Hub updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  organization_name:
                    type: string
                    nullable: true
                  plan:
                    type: string
                  trial_active:
                    type: boolean
                  trial_expired:
                    type: boolean
                  trial_ends_at:
                    type: string
                    nullable: true
                    format: date-time
                  invite_code:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                  users_count:
                    type: integer
                  active_external_users_count:
                    type: integer
                  max_messages:
                    type: integer
                    nullable: true
                  sources_count:
                    type: integer
                  max_sources:
                    type: integer
                    nullable: true
                  documents_count:
                    type: integer
                  max_documents:
                    type: integer
                    nullable: true
                  last_internal_conversation_at:
                    type: string
                    nullable: true
                    format: date-time
                  last_external_conversation_at:
                    type: string
                    nullable: true
                    format: date-time
                required:
                - id
                - name
                - plan
                - trial_active
                - trial_expired
                - created_at
                - users_count
                - active_external_users_count
                - sources_count
                - documents_count
                - last_internal_conversation_at
                - last_external_conversation_at
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
        '404':
          description: Hub not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hub:
                  type: object
                  properties:
                    plan:
                      type: string
                      enum:
                      - free
                      - enterprise
                      - free_unrestricted
                      - standard
                      - pro
                      - subsidized
                      example: enterprise
                    trial_started_at:
                      type: string
                      format: date
                      nullable: true
                      example: '2026-01-01'
                    trial_ends_at:
                      type: string
                      format: date
                      nullable: true
                      example: '2026-07-01'
                    custom_limits:
                      type: object
                      nullable: true
                      properties:
                        sources:
                          type: integer
                          example: 20
                        messages:
                          type: integer
                          example: 5000
                        documents:
                          type: integer
                          example: 2000
              required:
              - hub
  "/api/admin/hubs/{id}/activity":
    get:
      summary: Get a hub's lifecycle activity timeline
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns a curated, chronological (newest first)
        timeline of one hub's key lifecycle events — creation, deletion, plan changes,
        deletion requests, editors added/removed, data sources added/removed, first
        document synced, messaging platforms connected/disconnected, trial start/end
        date edits, custom limit edits, feature flag changes, and trial email toggles
        — read from the audit log so it still covers history through a hub that has
        since been deleted.
      parameters:
      - name: id
        in: path
        required: true
        description: Hub ID
        schema:
          type: integer
      responses:
        '200':
          description: Activity timeline returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    at:
                      type: string
                      format: date-time
                    actor_email:
                      type: string
                      nullable: true
                    detail:
                      type: string
                      nullable: true
                    old_plan:
                      type: string
                      nullable: true
                      description: Only present on plan_changed events
                    new_plan:
                      type: string
                      nullable: true
                      description: Only present on plan_changed events
                  required:
                  - type
                  - at
                  - actor_email
                  - detail
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/export/hubs":
    get:
      summary: Export hubs as CSV
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only endpoint to export all hubs data as CSV.
      responses:
        '200':
          description: CSV file generated successfully
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/export/message-reports":
    get:
      summary: Export message reports as CSV
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only endpoint to export all message reports as CSV.
      parameters:
      - name: hub_id
        in: query
        required: false
        description: Only export the reports of this hub
        schema:
          type: integer
      responses:
        '200':
          description: CSV file generated successfully
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/message-reports":
    get:
      summary: List message reports
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only endpoint that returns a page of message reports,
        newest first.
      parameters:
      - name: hub_id
        in: query
        required: false
        description: Only return the reports of this hub
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Page number, starting at 1; defaults to the last page
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Reports per page, from 1 to 100 (default 100)
        schema:
          type: integer
      responses:
        '200':
          description: Message reports returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        hub_id:
                          type: integer
                          nullable: true
                        hub_name:
                          type: string
                          nullable: true
                        message_id:
                          type: integer
                        message_link:
                          type: string
                          nullable: true
                        platform:
                          type: string
                          nullable: true
                        user_question:
                          type: string
                          nullable: true
                        message_body:
                          type: string
                          nullable: true
                        message_sent_at:
                          type: string
                          format: date-time
                          nullable: true
                        reported_by_email:
                          type: string
                          nullable: true
                        comment:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                      required:
                      - id
                      - hub_id
                      - hub_name
                      - message_id
                      - message_link
                      - platform
                      - user_question
                      - message_body
                      - message_sent_at
                      - reported_by_email
                      - comment
                      - created_at
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                    required:
                    - current_page
                    - per_page
                    - total_pages
                    - total_count
                required:
                - data
                - pagination
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/users/unconfirmed":
    get:
      summary: List users who have not confirmed their email
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns internal users whose email confirmation
        is still pending.
      responses:
        '200':
          description: Users returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                    hub_name:
                      type: string
                      nullable: true
                    hub_id:
                      type: integer
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    requested_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_login_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_active_at:
                      type: string
                      format: date-time
                      nullable: true
                  required:
                  - id
                  - email
                  - hub_name
                  - hub_id
                  - created_at
                  - requested_at
                  - last_login_at
                  - last_active_at
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/users/no-hub":
    get:
      summary: List users who are not a member of any hub
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns internal users who have no hub membership.
      responses:
        '200':
          description: Users returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                    hub_name:
                      type: string
                      nullable: true
                    hub_id:
                      type: integer
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    requested_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_login_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_active_at:
                      type: string
                      format: date-time
                      nullable: true
                  required:
                  - id
                  - email
                  - hub_name
                  - hub_id
                  - created_at
                  - requested_at
                  - last_login_at
                  - last_active_at
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/users/inactive":
    get:
      summary: List hub editors who have not been active recently
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns confirmed users with an approved hub
        membership whose last activity is older than the platform inactivity threshold,
        one row per approved membership, longest inactive first. `threshold_days`
        reports the cutoff that was applied.
      responses:
        '200':
          description: Users returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  threshold_days:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        email:
                          type: string
                        hub_name:
                          type: string
                          nullable: true
                        hub_id:
                          type: integer
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                        requested_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_login_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_active_at:
                          type: string
                          format: date-time
                          nullable: true
                      required:
                      - id
                      - email
                      - hub_name
                      - hub_id
                      - created_at
                      - requested_at
                      - last_login_at
                      - last_active_at
                required:
                - threshold_days
                - users
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/users/pending-approval":
    get:
      summary: List users with pending hub membership requests
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns one row per unapproved hub membership.
        A user may appear multiple times if they have pending requests across multiple
        hubs.
      responses:
        '200':
          description: Users returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                    hub_name:
                      type: string
                      nullable: true
                    hub_id:
                      type: integer
                      nullable: true
                    created_at:
                      type: string
                      format: date-time
                    requested_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_login_at:
                      type: string
                      format: date-time
                      nullable: true
                    last_active_at:
                      type: string
                      format: date-time
                      nullable: true
                  required:
                  - id
                  - email
                  - hub_name
                  - hub_id
                  - created_at
                  - requested_at
                  - last_login_at
                  - last_active_at
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/health":
    get:
      summary: Check system health status
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only endpoint to check system health including Sidekiq
        and Knowledge Service RQ metrics.
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - warning
                  sidekiq:
                    type: object
                    properties:
                      processed:
                        type: integer
                      failed:
                        type: integer
                      enqueued:
                        type: integer
                      retry_size:
                        type: integer
                      dead_size:
                        type: integer
                      processes:
                        type: integer
                      queues:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            size:
                              type: integer
                            latency:
                              type: number
                  knowledge_service_rq:
                    type: object
                    properties:
                      status:
                        type: string
                      enqueued_jobs:
                        type: integer
                      failed_jobs:
                        type: integer
                      active_workers:
                        type: integer
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - warning
                  sidekiq:
                    type: object
                  knowledge_service_rq:
                    type: object
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/users/{id}":
    delete:
      summary: Delete an unconfirmed or hubless user
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Permanently deletes a user account, but only
        if the user has not yet confirmed their email address or is not a member of
        any hub.
      parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer
      responses:
        '200':
          description: User deleted successfully
        '422':
          description: User has confirmed their account and is a member of a hub
        '404':
          description: User not found
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/statistics":
    get:
      summary: Get platform-wide analytics statistics
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns global counts (including all-time and
        churned hub counts, read from the audit log so a hard-deleted hub still counts),
        the churned-hubs list, documents by sync status, messages by state, bot replies
        by answered/unanswered, and average answer time.
      parameters:
      - name: group_by
        in: query
        required: false
        description: 'Time bucket: day, week (default), or month'
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Start of date range (ISO 8601)
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: End of date range (ISO 8601)
        schema:
          type: string
      responses:
        '200':
          description: Statistics returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  global_counts:
                    type: object
                    properties:
                      hubs:
                        type: integer
                        description: Currently-active (live) hub count
                      sources:
                        type: integer
                      conversations:
                        type: integer
                      users:
                        type: integer
                      external_users:
                        type: integer
                      documents:
                        type: integer
                      messages:
                        type: integer
                      hubs_all_time:
                        type: integer
                        description: Every hub ever created, including hard-deleted
                          ones
                      hubs_churned:
                        type: integer
                        description: Hubs hard-deleted while still on a free plan
                    required:
                    - hubs
                    - sources
                    - conversations
                    - users
                    - external_users
                    - documents
                    - messages
                    - hubs_all_time
                    - hubs_churned
                  churned_hubs:
                    type: array
                    description: Hubs hard-deleted while still on a free plan, most-recently-deleted
                      first
                    items:
                      type: object
                      properties:
                        hub_id:
                          type: integer
                        hub_name:
                          type: string
                        organization_name:
                          type: string
                          nullable: true
                        plan_at_deletion:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        deleted_at:
                          type: string
                          format: date-time
                      required:
                      - hub_id
                      - hub_name
                      - organization_name
                      - plan_at_deletion
                      - created_at
                      - deleted_at
                  documents_by_sync_status:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        pending:
                          type: integer
                        error:
                          type: integer
                        complete:
                          type: integer
                      required:
                      - date
                      - pending
                      - error
                      - complete
                  messages_by_state:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        user_message:
                          type: integer
                        bot_message:
                          type: integer
                      required:
                      - date
                  questions_by_answered:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        answered:
                          type: integer
                        unanswered:
                          type: integer
                      required:
                      - date
                      - answered
                      - unanswered
                  average_answer_times:
                    type: object
                    properties:
                      all_time:
                        type: number
                        nullable: true
                      last_week:
                        type: number
                        nullable: true
                      last_month:
                        type: number
                        nullable: true
                  hubs_by_creation_date:
                    type: array
                    description: Hubs created per bucket, split by whether they're
                      still live or were since hard-deleted
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        active:
                          type: integer
                        deleted:
                          type: integer
                      required:
                      - date
                      - active
                      - deleted
                required:
                - global_counts
                - churned_hubs
                - documents_by_sync_status
                - messages_by_state
                - questions_by_answered
                - hubs_by_creation_date
        '403':
          description: Forbidden - Not a super admin
        '401':
          description: Unauthorized
  "/api/admin/hubs/{id}/deleted":
    get:
      summary: Get a deleted hub's summary and activity timeline
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Super admin only. Returns a hard-deleted hub's last known name,
        organization, plan at deletion, created/deleted dates, and its full activity
        timeline — all read from the audit log, since the hub no longer exists as
        a live row. 404s for a hub id that is still live or never existed.
      parameters:
      - name: id
        in: path
        required: true
        description: Hub ID
        schema:
          type: integer
      responses:
        '200':
          description: Deleted hub summary returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  hub_id:
                    type: integer
                  hub_name:
                    type: string
                  organization_name:
                    type: string
                    nullable: true
                  plan_at_deletion:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  deleted_at:
                    type: string
                    format: date-time
                  activity:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        at:
                          type: string
                          format: date-time
                        actor_email:
                          type: string
                          nullable: true
                        detail:
