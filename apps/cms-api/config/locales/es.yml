  mailer_hub_welcome_new_member_greeting: "¡Éxito!"
  mailer_hub_welcome_new_member_body: "Tu solicitud para unirte a %{hub_name} en Suwali ha sido aprobada."
  mailer_hub_welcome_new_member_action: "Acceso a Suwali"
  mailer_hub_trial_greeting: "Hi %{name},"
  mailer_hub_trial_welcome_subject: "¡Bienvenido a Suwali! Vamos a programar tu llamada de incorporación"
  mailer_hub_trial_welcome_body: "¡Bienvenido a Suwali! Su prueba gratuita ha comenzado.\n\nPrepárese para responder a las preguntas de su comunidad con el contenido en el que confía. Luego haga algo que ningún otro chatbot hace: escuche lo que le dicen de vuelta.\n\nAgregue los primeros documentos, artículos o contenido que su chatbot usará para responder preguntas y luego intente hacer una pregunta sobre su contenido.\n\nSi necesita ayuda configurando las cosas, por favor comuníquese con %{support_email}, o reserve una demostración con nosotros:\n%{demo_link}\n\n¡Gracias!"
  mailer_hub_trial_halfway_subject: "¿Cómo están las cosas con tu prueba de Suwali?"
  mailer_hub_trial_halfway_body: "Esperamos que haya agregado contenido a Suwali e intentado chatear con su chatbot. Nos encantaría saber cómo van las cosas.\n\n¿Sabía que Suwali puede responder a su audiencia en inglés, español, francés, hindi, árabe y portugués?\n\n%{personalization_link}\n\nSi necesita ayuda configurando las cosas, por favor comuníquese con %{support_email}, o reserve una demostración con nosotros:\n%{demo_link}\n\n¡Gracias!"
  mailer_hub_trial_one_week_left_subject: "¿Listo para pasar a la siguiente fase de Suwali?"
  mailer_hub_trial_one_week_left_body: "Nos comunicamos para ver cómo van las cosas con su prueba de Suwali. ¿Está listo para conectarse a una plataforma de mensajería y poner su chatbot frente a su audiencia?\n\n%{whatsapp_link}\n\nLa mayoría de los chatbots solo responden preguntas. Suwali está diseñado para seguir adelante: invitando a las personas a compartir consejos, ideas y experiencias de su vida diaria para que su equipo los revise, verifique e incorpore en futuras respuestas.\n\nSi necesita ayuda configurando las cosas, o está listo para desbloquear la experiencia completa de Suwali, por favor comuníquese con %{support_email}, o reserve una demostración con nosotros:\n%{demo_link}\n\n¡Gracias!"
  mailer_hub_trial_three_days_left_subject: "¡Tu prueba de Suwali termina pronto!"
  mailer_hub_trial_three_days_left_body: "Esperamos que haya tenido la oportunidad de ver cómo Suwali puede descubrir preguntas sin responder, lagunas de información y temas emergentes de su audiencia.\n\nSu prueba gratuita termina pronto. Cuando eso suceda, aún tendrá acceso a Suwali, pero se convertirá en una experiencia solo de lectura.\n\nSuwali fue construido para organizaciones donde la confianza no es opcional. Si quiere hablar sobre cómo puede potenciar su organización, o está listo para desbloquear la experiencia completa de Suwali, por favor comuníquese con %{support_email}, o reserve una demostración con nosotros:\n%{demo_link}\n\n¡Gracias!"
  mailer_hub_trial_ends_tomorrow_subject: "Mañana es el último día de tu prueba de Suwali"
  mailer_hub_trial_ends_tomorrow_body: "¡Su prueba gratuita de Suwali termina mañana! Gracias por darnos una oportunidad.\n\nSi está listo para desbloquear la experiencia completa de Suwali, por favor comuníquese con %{support_email}, o reserve una demostración con nosotros:\n%{demo_link}\n\n¡Gracias!"
  mailer_hub_trial_hub_deleted_subject: "Tu cuenta de Suwali ha sido eliminada"
  mailer_hub_trial_hub_deleted_body: "Su cuenta de Suwali ha sido eliminada.\n\nLamentamos que se vaya, pero le agradecemos por darnos una oportunidad.\n\nSi alguna vez quiere intentarlo de nuevo, puede crear una cuenta en %{suwali_link} o comunicarse con nosotros para programar una demostración y ver qué hay de nuevo desde la última vez que lo probó:\n%{demo_link}\n\n¡Gracias!"
  message_registration_check_email: "Por favor, revisa tu correo electrónico para ver los siguientes pasos."
  mailer_user_account_exists_subject: "Intento de registro en Suwali"
  mailer_user_account_exists_greeting: "Hi %{email},"
  mailer_user_account_exists_body: "Alguien (esperemos que usted) intentó crear una cuenta en Suwali usando esta dirección de correo electrónico, pero ya existe una cuenta. Si fue usted, puede iniciar sesión o restablecer su contraseña usando el enlace de abajo. Si esto no fuera tú, puedes ignorar este correo electrónico."
