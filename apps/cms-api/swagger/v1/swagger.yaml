  "/api/admin/users/{id}/move-to-hub":
    patch:
      summary: Move a stray signup into an existing hub
      tags:
      - Admin
      security:
      - bearerAuth: []
      description: Write super admin only. Moves a user who is the sole member of
        a free trial hub into another hub as an editor. The new membership is pending
        approval by the target hub's admins unless approved is true. The original
        hub is left in place.
      parameters:
      - name: id
        in: path
        required: true
        description: User ID
        schema:
          type: integer
      responses:
        '200':
          description: User moved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        '422':
          description: User is not the sole member of a free trial hub, or the target
            hub has no approved admin or is scheduled for deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Forbidden - Requester is not a write platform admin, or the
            user is a platform admin
        '404':
          description: User or hub not found
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hub_id:
                  type: integer
                  description: Target hub ID
                approved:
                  type: boolean
                  description: Approve the new membership right away instead of leaving
                    it to the hub's admins
              required:
              - hub_id
