name: CMS-API Run Unit Tests

on:
  push:
    paths:
      - 'apps/cms-api/**'
      - '.github/workflows/cms-api**'
      - '.github/semgrep/**'
      - '.github/workflows/semgrep-scan.yml'
      - '!**.md'
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  semgrep-scan:
    uses: ./.github/workflows/semgrep-scan.yml
    with:
      app-name: cms-api
      path: apps/cms-api

  build-and-run-unit-tests:
    runs-on: ubuntu-24.04-arm

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
    - name: Checkout repository
      id: checkout
      uses: actions/checkout@v4

    - name: Generate tag list
      id: meta-tags
      uses: docker/metadata-action@v5
      with:
        images: |
          #cms-api
          localhost:5000/suwali-cms-api
        tags: |
          type=ref,event=branch
          type=raw,value=${{ github.sha }}

    - name: Set up Docker Buildx
      id: set-up-build
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host

    - name: Build
      id: build-local-image
      uses: docker/build-push-action@v6
      env:
        IMAGE_TAG: ${{ github.sha }}
      with:
        push: true
        context: ./apps/cms-api/
        cache-from: type=gha,scope=cms-api-test
        cache-to: type=gha,scope=cms-api-test
        build-args: |
          BUNDLE_FROZEN=true
        tags: ${{ steps.meta-tags.outputs.tags }}
        labels: ${{ steps.meta-tags.outputs.labels }}

    - name: Run unit tests
      id: unit-tests
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker run -e RAILS_ENV=test -e DEPLOY_ENV=ci localhost:5000/suwali-cms-api:$IMAGE_TAG bin/run-linter-and-unit-tests.sh

  notify-slack:
    needs: build-and-run-unit-tests
    if: failure()
    uses: ./.github/workflows/slack-notify.yml
    with:
      status: failure
      workflow-name: ${{ github.workflow }}
    secrets: inherit
