  mailer_hub_welcome_new_member_action: "सुवाली तक पहुँचें"
  mailer_hub_trial_greeting: "नमस्ते %{name},"
  mailer_hub_trial_welcome_subject: "Suwali में आपका स्वागत है! आइए आपकी ऑनबोर्डिंग कॉल का समय निर्धारित करें"
  mailer_hub_trial_welcome_body: "Suwali में आपका स्वागत है! आपका नि:शुल्क परीक्षण शुरू हो गया है।\n\nअपने समुदाय के सवालों के जवाब अपने भरोसेमंद सामग्री से देने के लिए तैयार हो जाएं। फिर कुछ ऐसा करें जो कोई अन्य चैटबॉट नहीं करता — सुनिए वे क्या कहते हैं।\n\nपहले दस्तावेज़, लेख, या सामग्री जोड़ें, जिसका उपयोग आपका चैटबॉट प्रश्नों का उत्तर देने के लिए करेगा, फिर अपनी सामग्री के बारे में कोई प्रश्न पूछने का प्रयास करें।\n\nअगर आपको सेटअप में सहायता की आवश्यकता है, कृपया %{support_email} पर संपर्क करें, या हमसे एक डेमो बुक करें: %{demo_link}\n\nधन्यवाद!"
  mailer_hub_trial_halfway_subject: "आपके Suwali परीक्षण के साथ चीजें कैसी चल रही हैं?"
  mailer_hub_trial_halfway_body: "उम्मीद है कि आपने Suwali में कुछ सामग्री जोड़ी है और अपने चैटबॉट के साथ बातचीत की कोशिश की है। हमें यह जानकर खुशी होगी कि चीजें कैसी चल रही हैं।\n\nक्या आप जानते हैं कि Suwali आपके दर्शकों को अंग्रेजी, स्पेनिश, फ्रेंच, हिंदी, अरबी और पुर्तगाली में उत्तर दे सकता है?\n\n%{personalization_link}\n\nअगर आपको सेटअप में सहायता की आवश्यकता है, कृपया %{support_email} पर संपर्क करें, या हमसे एक डेमो बुक करें:\n%{demo_link}\n\nधन्यवाद!"
  mailer_hub_trial_one_week_left_subject: "Suwali के अगले चरण में जाने के लिए तैयार?"
  mailer_hub_trial_one_week_left_body: "हम ये जानने के लिए संपर्क कर रहे हैं कि आपके Suwali परीक्षण के साथ चीजें कैसी चल रही हैं। मैसेजिंग प्लेटफ़ॉर्म से कनेक्ट होने और अपने दर्शकों के सामने अपना चैटबॉट लाने के लिए तैयार?\n\n%{whatsapp_link}\n\nअधिकांश चैटबॉट केवल प्रश्नों का उत्तर देते हैं। Suwali चलती रहती है - लोगों को टिप्स, अंतर्दृष्टि, और उनकी दैनिक जीवन से अनुभव साझा करने के लिए आमंत्रित करती है ताकि आपकी टीम समीक्षा, सत्यापन और भविष्य के जवाबों में शामिल कर सकें।\n\nअगर आपको सेटअप में सहायता की आवश्यकता है, या Suwali के पूर्ण अनुभव को अनलॉक करने के लिए तैयार हैं, तो कृपया %{support_email} पर संपर्क करें, या हमसे एक डेमो बुक करें:\n%{demo_link}\n\nधन्यवाद!"
  mailer_hub_trial_three_days_left_subject: "आपका Suwali परीक्षण जल्द ही समाप्त होने वाला है!"
  mailer_hub_trial_three_days_left_body: "हमें उम्मीद है कि आपको यह देखने का अवसर मिला है कि कैसे Suwali आपके दर्शकों में अनुत्तरित प्रश्नों, जानकारी की कमी, और उभरते विषयों को सतह पर ला सकता है।\n\nआपका नि:शुल्क परीक्षण जल्द ही खत्म हो जाएगा। जब ऐसा होगा, तब भी आपके पास Suwali की पहुंच होगी, लेकिन यह केवल पढ़ने का अनुभव बन जाएगा।\n\nSuwali उन संगठनों के लिए बनाया गया है जहाँ भरोसा कोई विकल्प नहीं है। अगर आप यह जानना चाहते हैं कि यह आपके संगठन को कैसे सुपरचार्ज कर सकता है, या Suwali के पूर्ण अनुभव को अनलॉक करने के लिए तैयार हैं, तो कृपया %{support_email} पर संपर्क करें, या हमसे एक डेमो बुक करें: %{demo_link}\n\nधन्यवाद!"
  mailer_hub_trial_ends_tomorrow_subject: "कल आपका Suwali परीक्षण का अंतिम दिन है"
  mailer_hub_trial_ends_tomorrow_body: "आपका Suwali का नि:शुल्क परीक्षण कल समाप्त हो रहा है! हमें आज़माने के लिए धन्यवाद।\n\nअगर आप Suwali के पूर्ण अनुभव को अनलॉक करने के लिए तैयार हैं, तो कृपया %{support_email} पर संपर्क करें, या हमसे एक डेमो बुक करें: %{demo_link}\n\nधन्यवाद!"
  mailer_hub_trial_hub_deleted_subject: "आपका Suwali खाता हटा दिया गया है"
  mailer_hub_trial_hub_deleted_body: "आपका Suwali खाता हटा दिया गया है।\n\nहम आपको जाते हुए देखकर दुखी हैं, लेकिन हमें धन्यवाद देने के लिए आभार।\n\nअगर आप किसी भी समय पुनः प्रयास करना चाहें, तो आप %{suwali_link} पर खाता बना सकते हैं या हमारे साथ डेमो शेड्यूल करने के लिए संपर्क कर सकते हैं और देख सकते हैं कि आपने आखिरी बार कोशिश करने के बाद क्या नया है:\n%{demo_link}\n\nधन्यवाद!"
