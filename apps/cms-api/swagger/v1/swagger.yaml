  "/api/hubs/{hub_id}/topics":
    get:
      summary: Lists the topics of a hub
      tags:
      - Topic
      security:
      - bearerAuth: []
      parameters:
      - name: hub_id
        in: path
        description: Hub ID
        required: true
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Only the topics whose name contains this, whatever the case
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number, from 1
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Topics per page, up to 100
        schema:
          type: integer
      - name: ids
        in: query
        required: false
        description: Only the topics with these ids, separated by commas, such as
          to show the names of those a list is filtered by
        schema:
          type: string
      - name: item_type
        in: query
        required: false
        enum:
        - Document
        - Contribution
        - Notebook
        description: "Counts the items of this kind that each topic is on, among those
          of its list, and leaves out the topics that are on none of them. Adds untagged_count,
          how many of them have no topics:\n * `Document` \n * `Contribution` \n *
          `Notebook` \n "
        schema:
          type: string
      - name: source_id
        in: query
        required: false
        description: 'Required with item_type Document: the data source whose documents
          are counted'
        schema:
          type: integer
      responses:
        '200':
          description: A page of the topics of the hub, by name, with the number of
            data source items each is on
