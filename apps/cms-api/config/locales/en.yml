  mailer_hub_trial_greeting: "Hi %{name},"
  mailer_hub_trial_welcome_subject: "Welcome to Suwali! Let's schedule your onboarding call"
  mailer_hub_trial_welcome_body: "Welcome to Suwali! Your free trial has started.\n\nGet ready to answer your community's questions with the content you trust. Then do something no other chatbot does — listen to what they say back.\n\nAdd the first documents, articles, or content your chatbot will use to respond to questions then try asking a question about your content.\n\nIf you need help with setting things up, please reach out to %{support_email}, or book a demo with us:\n%{demo_link}\n\nThank you!"
  mailer_hub_trial_halfway_subject: "How are things with your Suwali trial?"
  mailer_hub_trial_halfway_body: "Hopefully you have added some content to Suwali and tried chatting with your chatbot. We'd love to hear how things are going.\n\nDid you know that Suwali can respond to your audience in English, Spanish, French, Hindi, Arabic, and Portuguese?\n\n%{personalization_link}\n\nIf you need help with setting things up, please reach out to %{support_email}, or book a demo with us:\n%{demo_link}\n\nThank you!"
  mailer_hub_trial_one_week_left_subject: "Ready to move to the next phase of Suwali?"
  mailer_hub_trial_one_week_left_body: "We are reaching out to see how things are going with your Suwali trial. Ready to connect to a messaging platform and get your chatbot in front of your audience?\n\n%{whatsapp_link}\n\nMost chatbots just answer questions. Suwali is built to keep going — inviting people to share tips, insights, and experiences from their daily lives for your team to review, verify, and fold into future responses.\n\nIf you need help with setting things up, or are ready to unlock the full Suwali experience, please reach out to %{support_email}, or book a demo with us:\n%{demo_link}\n\nThank you!"
  mailer_hub_trial_three_days_left_subject: "Your Suwali trial ends soon!"
  mailer_hub_trial_three_days_left_body: "We hope you have had the chance to see how Suwali can surface unanswered questions, information gaps, and emerging topics from your audience.\n\nYour free trial ends soon. When that happens you will still have access to Suwali, but it will become a read only experience.\n\nSuwali was built for organizations where trust isn't optional. If you want to talk about how it can supercharge your organization, or are ready to unlock the full Suwali experience, please reach out to %{support_email}, or book a demo with us:\n%{demo_link}\n\nThank you!"
  mailer_hub_trial_ends_tomorrow_subject: "Tomorrow is the last day of your Suwali trial"
  mailer_hub_trial_ends_tomorrow_body: "Your free trial of Suwali ends tomorrow! Thanks for giving us a try.\n\nIf you are ready to unlock the full Suwali experience, please reach out to %{support_email}, or book a demo with us:\n%{demo_link}\n\nThank you!"
  mailer_hub_trial_hub_deleted_subject: "Your Suwali account has been removed"
  mailer_hub_trial_hub_deleted_body: "Your Suwali account has been removed.\n\nWe're sorry to see you go, but we thank you for giving us a try.\n\nIf you ever want to try again, you can create an account at %{suwali_link} or reach out to us to schedule a demo and see what is new since you last tried:\n%{demo_link}\n\nThank you!"
