  mailer_hub_welcome_new_member_subject: "مرحبا بكم في %{hub_name} في سوالي!"
  mailer_hub_welcome_new_member_greeting: "نجاح!"
  mailer_hub_welcome_new_member_body: "لقد تمت الموافقة على طلبك للانضمام إلى %{hub_name} في سوالي."
  mailer_hub_welcome_new_member_action: "الوصول إلى سوالي"
  mailer_hub_trial_greeting: "Hi %{name},"
  mailer_hub_trial_welcome_subject: "مرحبا بكم في سوالي! دعونا نحدد موعد مكالمة أونبواردينغ"
  mailer_hub_trial_welcome_body: "أهلاً بك في Suwali! لقد بدأت تجربتك المجانية.\n\nاستعد للإجابة على أسئلة مجتمعك بالمحتوى الذي تثق به. ثم قم بشيء لا يفعله أي روبوت محادثة آخر - استمع إلى ما يقولونه بالمقابل.\n\nأضف المستندات أو المقالات أو المحتوى الأول الذي سيستخدمه روبوت المحادثة للرد على الأسئلة ثم حاول طرح سؤال حول المحتوى الخاص بك.\n\nإذا كنت بحاجة إلى مساعدة في إعداد الأمور، لا تتردد في التواصل مع %{support_email} أو حجز عرض توضيحي معنا:\n%{demo_link}\n\nشكرًا لك!"
  mailer_hub_trial_halfway_subject: "كيف توجد الأمور مع محاكمة سوالي الخاصة بك؟"
  mailer_hub_trial_halfway_body: "نأمل أنك أضفت بعض المحتوى إلى Suwali وحاولت الدردشة مع روبوت المحادثة الخاص بك. نود أن نسمع كيف تسير الأمور.\n\nهل تعلم أن Suwali يمكن أن يرد على جمهورك باللغات الإنجليزية، الإسبانية، الفرنسية، الهندية، العربية، والبرتغالية؟\n\n%{personalization_link}\n\nإذا كنت بحاجة إلى مساعدة في إعداد الأمور، لا تتردد في التواصل مع %{support_email} أو حجز عرض توضيحي معنا:\n%{demo_link}\n\nشكرًا لك!"
  mailer_hub_trial_one_week_left_subject: "هل أنت مستعد للانتقال إلى المرحلة التالية من سوالي؟"
  mailer_hub_trial_one_week_left_body: "نحن نتواصل لمعرفة كيفية سير الأمور مع تجربتك في Suwali. هل أنت جاهز للاتصال بمنصة الرسائل وعرض روبوت المحادثة الخاص بك أمام جمهورك؟\n\n%{whatsapp_link}\n\nمعظم روبوتات المحادثة تكتفي بالإجابة على الأسئلة. تم تصميم Suwali ليواصل التفاعل - دعوة الناس لمشاركة النصائح والأفكار والتجارب من حياتهم اليومية لفريقك لمراجعتها والتحقق منها ودمجها في ردود مستقبلية.\n\nإذا كنت بحاجة إلى مساعدة في إعداد الأمور، أو مستعد لتجربة كاملة لسولة Suwali، لا تتردد في التواصل مع %{support_email} أو حجز عرض توضيحي معنا:\n%{demo_link}\n\nشكرًا لك!"
  mailer_hub_trial_three_days_left_subject: "تجربة سوالي الخاصة بك تنتهي قريباً!"
  mailer_hub_trial_three_days_left_body: "نأمل أنك حظيت بالفرصة لرؤية كيف يمكن لـ Suwali اكتشاف الأسئلة الغير مجابة، فجوات المعلومات، والمواضيع الناشئة من جمهورك.\n\nستنتهي تجربتك المجانية قريبًا. عند حدوث ذلك، ستظل لديك القدرة على الوصول إلى Suwali، لكنها ستصبح تجربة قراءة فقط.\n\nتم بناء Suwali للمنظمات حيث الثقة غير اختيارية. إذا كنت ترغب في الحديث عن كيفية تعزيز مؤسستك، أو مستعد لتجربة كاملة لسولة Suwali، لا تتردد في التواصل مع %{support_email} أو حجز عرض توضيحي معنا:\n%{demo_link}\n\nشكرًا لك!"
  mailer_hub_trial_ends_tomorrow_subject: "غدا هو آخر يوم من محاكمتك في سولي"
  mailer_hub_trial_ends_tomorrow_body: "تنتهي تجربتك المجانية لـ Suwali غدًا! شكرًا على تجربتنا.\n\nإذا كنت مستعدًا لتجربة كاملة لسولة Suwali، لا تتردد في التواصل مع %{support_email} أو حجز عرض توضيحي معنا:\n%{demo_link}\n\nشكرًا لك!"
  mailer_hub_trial_hub_deleted_subject: "تم إزالة حسابك في سوالي"
  mailer_hub_trial_hub_deleted_body: "تم إزالة حسابك في Suwali.\n\nنأسف لرؤيتك تتركنا، لكننا نشكرك على إعطائنا فرصة.\n\nإذا أردت المحاولة مرة أخرى في أي وقت، يمكنك إنشاء حساب على %{suwali_link} أو التواصل معنا لجدولة عرض توضيحي ومعرفة ما هو جديد منذ آخر مرة جربتنا فيها:\n%{demo_link}\n\nشكرًا لك!"
  message_registration_check_email: "الرجاء التحقق من بريدك الإلكتروني للخطوات التالية."
  mailer_user_account_exists_subject: "محاولة تسجيل الدخول إلى سوالي"
  mailer_user_account_exists_greeting: "Hi %{email},"
  mailer_user_account_exists_body: "حاول شخص ما (آمل منك) إنشاء حساب في سوالي باستخدام عنوان البريد الإلكتروني هذا، ولكن هناك حساب موجود بالفعل. إذا كان هذا لك، يمكنك تسجيل الدخول أو إعادة تعيين كلمة المرور الخاصة بك باستخدام الرابط أدناه. إذا لم يكن هذا أنت، يمكنك تجاهل هذا البريد الإلكتروني بأمان."
