  "/api/hubs/{id}/statistics":
    get:
      summary: Returns statistics of a hub
      tags:
      - Hub
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        description: Hub ID
        required: true
        schema:
          type: string
      - name: fields
        in: query
        required: false
        description: Comma-separated list of fields to return
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Start date (ISO 8601 format)
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: End date (ISO 8601 format)
        schema:
          type: string
      - name: group_by
        in: query
        required: false
        enum:
        - day
        - week
        - month
        - range
        - rolling_week
        description: "Bucket size for time-series fields (defaults to day). \"range\"
          returns the whole period as a single bucket; \"rolling_week\" counts seven-day
          buckets from the start of the window rather than from Monday:\n * `day`
          \n * `week` \n * `month` \n * `range` \n * `rolling_week` \n "
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: How many records ranked fields return (defaults to 5, capped
          at 100)
        schema:
          type: integer
      responses:
        '200':
          description: Hub statistics
        '401':
          description: Unauthorized
        '404':
          description: Hub not found
